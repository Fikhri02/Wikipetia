components:
  schemas:
    BlockBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BlockBody.json
          format: uri
          readOnly: true
          type: string
        completion: {}
        content: {}
        id:
          type: string
        module_id:
          type: string
        sort_key:
          type: string
        title:
          type: string
        type:
          type: string
      required:
        - id
        - module_id
        - title
        - type
        - sort_key
        - content
        - completion
      type: object
    BlockListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BlockListOutputBody.json
          format: uri
          readOnly: true
          type: string
        blocks:
          items:
            $ref: "#/components/schemas/BlockBody"
          type:
            - array
            - "null"
      required:
        - blocks
      type: object
    CourseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CourseBody.json
          format: uri
          readOnly: true
          type: string
        description:
          type: string
        id:
          type: string
        pet_enabled:
          type: boolean
        title:
          type: string
        visibility:
          type: string
      required:
        - id
        - title
        - description
        - visibility
        - pet_enabled
      type: object
    CourseListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CourseListOutputBody.json
          format: uri
          readOnly: true
          type: string
        courses:
          items:
            $ref: "#/components/schemas/CourseBody"
          type:
            - array
            - "null"
      required:
        - courses
      type: object
    CreateBlockInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateBlockInputBody.json
          format: uri
          readOnly: true
          type: string
        completion: {}
        content: {}
        title:
          maxLength: 200
          type: string
        type:
          enum:
            - reading
            - video_youtube
            - quiz
          type: string
      required:
        - title
        - type
      type: object
    CreateCourseInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateCourseInputBody.json
          format: uri
          readOnly: true
          type: string
        description:
          maxLength: 2000
          type: string
        pet_enabled:
          type: boolean
        title:
          description: Course title
          maxLength: 200
          type: string
        visibility:
          enum:
            - public
            - unlisted
            - private
          type: string
      required:
        - title
      type: object
    CreateNamedInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateNamedInputBody.json
          format: uri
          readOnly: true
          type: string
        title:
          maxLength: 200
          type: string
      required:
        - title
      type: object
    CreateQuestionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateQuestionInputBody.json
          format: uri
          readOnly: true
          type: string
        answer: {}
        kind:
          enum:
            - mcq_single
            - true_false
            - typed
          type: string
        prompt: {}
        topic_id:
          type: string
      required:
        - kind
        - prompt
        - answer
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    MoveInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/MoveInputBody.json
          format: uri
          readOnly: true
          type: string
        after:
          description: Place immediately after this sibling
          type: string
        before:
          description: Place immediately before this sibling
          type: string
      type: object
    NamedBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/NamedBody.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        sort_key:
          type: string
        title:
          type: string
      required:
        - id
        - title
        - sort_key
      type: object
    NamedListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/NamedListOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/NamedBody"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    OutlineBlockBody:
      additionalProperties: false
      properties:
        question_count:
          format: int64
          type: integer
        topic_ids:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - topic_ids
        - question_count
      type: object
    OutlineModuleBody:
      additionalProperties: false
      properties:
        blocks:
          items:
            $ref: "#/components/schemas/OutlineBlockBody"
          type:
            - array
            - "null"
        id:
          type: string
        sort_key:
          type: string
        title:
          type: string
      required:
        - id
        - title
        - sort_key
        - blocks
      type: object
    OutlineOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/OutlineOutputBody.json
          format: uri
          readOnly: true
          type: string
        course:
          $ref: "#/components/schemas/CourseBody"
        modules:
          items:
            $ref: "#/components/schemas/OutlineModuleBody"
          type:
            - array
            - "null"
        topics:
          items:
            $ref: "#/components/schemas/NamedBody"
          type:
            - array
            - "null"
      required:
        - course
        - topics
        - modules
      type: object
    QuestionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/QuestionBody.json
          format: uri
          readOnly: true
          type: string
        answer: {}
        block_id:
          type: string
        id:
          type: string
        kind:
          type: string
        prompt: {}
        sort_key:
          type: string
        topic_id:
          type: string
      required:
        - id
        - block_id
        - kind
        - prompt
        - answer
        - sort_key
      type: object
    QuestionListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/QuestionListOutputBody.json
          format: uri
          readOnly: true
          type: string
        questions:
          items:
            $ref: "#/components/schemas/QuestionBody"
          type:
            - array
            - "null"
      required:
        - questions
      type: object
    RenameInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RenameInputBody.json
